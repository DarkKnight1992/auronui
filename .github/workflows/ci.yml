name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/common-actions/install

      - name: Build
        run: pnpm exec turbo build

      - name: Lint
        run: pnpm exec turbo lint

      - name: Typecheck
        run: pnpm exec turbo typecheck

      # One package at a time: each Vitest run already uses a worker per core,
      # and running the Vue and React suites side by side oversubscribes the
      # runner until axe-heavy tests hit their timeouts.
      - name: Test
        run: pnpm exec turbo test --concurrency=1

      - name: Tree-shaking check
        run: |
          pnpm --filter tree-shaking-test build
          node apps/tree-shaking-test/check-bundle.mjs

  ssr-smoke:
    name: SSR Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup
        uses: ./.github/common-actions/install

      - name: Build @auronui/vue
        run: pnpm exec turbo build --filter=@auronui/vue

      - name: Build SSR app
        run: pnpm --filter ssr-test build

      - name: Run SSR smoke test
        run: pnpm --filter ssr-test test:ssr
