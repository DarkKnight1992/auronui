name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish packages
    # A manual run publishes whatever ref it was started on — only allow
    # release tags, never an arbitrary branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pinned rather than
      # @latest: this job holds publish rights, so it must not pick up
      # whatever npm release appears next.
      - name: Upgrade npm client engine
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @auronui/vue
        run: pnpm exec turbo build --filter=@auronui/vue

      - name: Build @auronui/react
        run: pnpm exec turbo build --filter=@auronui/react

      # Fixed: Publishes via pnpm from the root using workspace-aware filtering
      - name: Publish @auronui/styles
        run: pnpm --filter=@auronui/styles publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      # Fixed: Publishes via pnpm from the root using workspace-aware filtering
      - name: Publish @auronui/vue
        run: pnpm --filter=@auronui/vue publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @auronui/react
        run: pnpm --filter=@auronui/react publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
