name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # FIX 2: Force upgrade npm client to v11+ to resolve the monorepo OIDC drop bug
      - name: Upgrade npm client engine
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @auronui/vue
        run: pnpm exec turbo build --filter=@auronui/vue

      - name: Publish @auronui/styles
        run: npm publish ./packages/styles --no-git-checks --provenance --access public

      - name: Publish @auronui/vue
        run: npm publish ./packages/vue --no-git-checks --provenance --access public
