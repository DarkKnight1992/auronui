name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @auronui/vue
        run: pnpm exec turbo build --filter=@auronui/vue

      - name: Publish @auronui/styles
        run: pnpm publish --filter=@auronui/styles --no-git-checks --provenance

      - name: Publish @auronui/vue
        run: pnpm publish --filter=@auronui/vue --no-git-checks --provenance
