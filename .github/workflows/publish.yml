name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm client engine
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @auronui/vue
        run: pnpm exec turbo build --filter=@auronui/vue

      - name: Build @auronui/react
        run: pnpm exec turbo build --filter=@auronui/react

      # Fixed: Publishes via pnpm from the root using workspace-aware filtering
      - name: Publish @auronui/styles
        run: pnpm --filter=@auronui/styles publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      # Fixed: Publishes via pnpm from the root using workspace-aware filtering
      - name: Publish @auronui/vue
        run: pnpm --filter=@auronui/vue publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish @auronui/react
        run: pnpm --filter=@auronui/react publish *.tgz --no-git-checks --provenance --access public
        env:
          NPM_CONFIG_PROVENANCE: true
