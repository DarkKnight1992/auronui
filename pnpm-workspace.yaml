packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true

# Security: force patched versions of vulnerable *transitive* dev/test
# dependencies (pnpm audit, 2026-10-07). None of these reach the published
# @auronui/* packages. Each stays within the major its parent already uses,
# except where noted. Drop an entry once its parent ships the fix itself.
overrides:
  "brace-expansion@<2": ^1.1.21
  "brace-expansion@>=2 <3": ^2.1.7
  "brace-expansion@>=4 <6": ^5.0.12
  "tar@>=7 <8": ^7.5.22
  "fast-uri@>=3 <4": ^3.1.8
  "js-cookie@>=3 <4": ^3.0.7
  "nanoid@<4": ^3.3.18
  "postcss@>=8 <9": ^8.5.23
  "postcss-selector-parser@>=7 <8": ^7.1.6
  "svgo@>=4 <5": ^4.1.0
  "browserslist@>=4 <5": ^4.28.7
  "baseline-browser-mapping@>=2 <3": ^2.11.0
  "@babel/core@>=7 <8": ^7.29.6
  "@humanfs/node@<1": ^0.16.8
  "source-map-js@>=1 <2": ^1.2.2
  "ws@>=8 <9": ^8.21.0
  # VitePress 1.x still pins Vite 5, which no longer receives security fixes.
  "vitepress>vite": ^6.4.4
  # 0.27.3-0.28.0 allow a Windows dev-server file read (tsx in apps/docs, Nuxt's Vite 7).
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
